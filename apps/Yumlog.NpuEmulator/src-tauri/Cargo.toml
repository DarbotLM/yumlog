[package]
name = "yumlog-npu-emulator"
version = "0.6.0"
description = "Native Yumlog NPU emulator container app"
authors = ["Darbot Labs"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.95"

[lib]
name = "yumlog_npu_emulator"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "=3.0.0-alpha.6", features = [] }
tauri-runtime-cef = { version = "=3.0.0-alpha.7", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
phf_generator = { path = "vendor/phf_generator-randfix" }
