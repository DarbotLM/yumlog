name: Studio wiki Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '_config.yml'
      - 'apps/Yumlog.Native/Studio/branding/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - '_config.yml'
      - 'apps/Yumlog.Native/Studio/branding/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: read

concurrency:
  group: wiki-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}
          persist-credentials: false
          lfs: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm install --global npm@12.2.3 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: website/build
  deploy:
    if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
