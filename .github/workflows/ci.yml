name: darbot.yumlog CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  maintained-components:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - name: Set up .NET 10 native runtime and SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Set up .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
      - name: Build Paperboy desktop app
        run: dotnet build .\apps\Paperboy.Desktop\Paperboy.Desktop.csproj -c Release
      - name: Build Paperboy MCP app
        run: dotnet build .\apps\Paperboy.Mcp\Paperboy.Mcp.csproj -c Release
      - name: Build native desktop app
        run: |
          dotnet build .\apps\Yumlog.Native\Yumlog.Native.fsproj -c Release
          $native = .\launchers\Get-YumlogBuildOutput.ps1 -Project Yumlog.Native -Configuration Release
          if (-not (Test-Path "$native\Yumlog.Native.dll") -or -not (Test-Path "$native\Yumlog.Native.exe")) { throw "Native desktop build outputs are incomplete." }
      - name: Build native CLI
        run: dotnet build .\apps\Yumlog.Native.Cli\Yumlog.Native.Cli.fsproj -c Release
      - name: Run native self-test
        shell: pwsh
        run: |
          $exe = Join-Path (.\launchers\Get-YumlogBuildOutput.ps1 -Project Yumlog.Native.Cli -Configuration Release) 'Yumlog.Native.Cli.exe'
          & $exe selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle and extension contracts
        run: |
          Import-Module Pester -MinimumVersion 5.0 -ErrorAction Stop
          $result = Invoke-Pester -Path .\Skills\Test-ScreenSkills.Tests.ps1, .\Skills\Test-PaperboyBundle.Tests.ps1, .\Skills\Test-PaperboyExtensions.Tests.ps1, .\Skills\Test-PaperboyAgentCardPaths.Tests.ps1 -Output Detailed -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) { exit 1 }
      - name: Build APIM foundation
        run: dotnet build .\apps\Yumlog.APIM.Service\Yumlog.APIM.Service.fsproj -c Release
      - name: APIM foundation contracts
        run: .\launchers\Test-YumlogAPIMRoundTrip.ps1
      - name: Widget authoring contracts
        run: dotnet run --project .\apps\Yumlog.WidgetStudio\Yumlog.WidgetStudio.csproj -c Release -- self-test
      - name: Build native desktop and CLI with nullness errors enabled
        run: dotnet build .\apps\Yumlog.Native\Yumlog.Native.fsproj -c Release
      - name: Native extension and MDKG contracts
        run: |
          .\apps\Yumlog.Native\Test-YumlogNativeExtensibility.ps1 -Configuration Release
          .\launchers\Test-YumlogNativeMdkgRoundTrip.ps1 -Configuration Release
          .\launchers\Test-YumlogNativeHandoff.ps1 -Configuration Release
      - name: Build and smoke-test production package
        run: |
          .\launchers\install.ps1
          .\launchers\Build-YumlogProduction.ps1 -DotnetPath dotnet
          .\launchers\Test-YumlogProductionPackage.ps1
      - name: Studio script syntax
        run: node --check apps/Yumlog.Native/Studio/studio.js
      - name: Studio smoke (native workspace flow)
        run: .\launchers\Test-YumlogStudioSmoke.ps1 -SkipUi
      - name: Media preset contracts
        run: dotnet fsi .\launchers\test-media-presets.fsx
      - name: Review tools contracts (OCR, MDKG import, runbook proofs)
        run: .\launchers\Test-YumlogReviewTools.ps1
      - name: gen-audio speech and transcription boundary
        run: .\launchers\Test-YumlogGenAudio.ps1
      - name: Agent client protocol contracts
        run: .\launchers\Test-YumlogAgentProtocol.ps1 -DotnetPath dotnet
      - name: Native CLI self-test
        run: dotnet run --no-build --project .\apps\Yumlog.Native.Cli\Yumlog.Native.Cli.fsproj -c Release -- selftest
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check Yumlog NPU emulator
        run: |
          npm ci --prefix apps/Yumlog.NpuEmulator --ignore-scripts --no-audit --no-fund
          cargo check --locked --manifest-path apps/Yumlog.NpuEmulator/src-tauri/Cargo.toml
          $graph = cargo tree --locked --manifest-path apps/Yumlog.NpuEmulator/src-tauri/Cargo.toml -i glib --target all
          if ($LASTEXITCODE -ne 0 -or ($graph -join [Environment]::NewLine) -match 'glib v0\.(?:[0-9]|1[0-9])\.') { throw "Vulnerable glib graph detected." }
          $randGraph = cargo tree --locked --manifest-path apps/Yumlog.NpuEmulator/src-tauri/Cargo.toml -d --target all
          if (($randGraph -join [Environment]::NewLine) -match 'rand v0\.7\.') { throw "Vulnerable rand graph detected." }
      - name: Test Yumlog NPU emulator
        run: cargo test --locked --manifest-path apps/Yumlog.NpuEmulator/src-tauri/Cargo.toml
      - name: Build Yumlog NPU emulator executable
        run: npm run --prefix apps/Yumlog.NpuEmulator tauri -- build --ci --no-bundle
